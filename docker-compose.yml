version: "3.9"
services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - crudhouse
      - ui
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://crudhouse:8000
    environment:
      BACKEND_URL: http://crudhouse:8000
    depends_on:
      - crudhouse
    restart: unless-stopped

  crudhouse:
    build:
      context: .
      dockerfile: ./crudhouse/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./crudhouse:/app/crudhouse
      - staticfiles:/app/crudhouse/staticfiles
    environment:
      ENV: ${ENV}
      DATABASE: ${DATABASE:-postgres}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      SUPERUSER_USERNAME: ${SUPERUSER_USERNAME}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
    depends_on:
      - db
  scheduler:
    build:
      context: .
      dockerfile: ./scheduler/Dockerfile
    environment:
      ENV: ${ENV}
      DATABASE: ${DATABASE:-postgres}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-rabbit}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_SCHEDULE_QUEUE: ${RABBITMQ_SCHEDULE_QUEUE:-schedule}
    depends_on:
      - db
      - crudhouse
      - rabbitmq
    restart: unless-stopped
  logger:
    build:
      context: .
      dockerfile: ./logger/Dockerfile
    environment:
      ENV: ${ENV}
      DATABASE: ${DATABASE:-postgres}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-rabbit}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      # Dedicated var: every consumer of schedule_exchange needs its OWN
      # queue. Sharing one RABBITMQ_SCHEDULE_QUEUE across services puts them
      # on the same queue, and RabbitMQ then round-robins messages between
      # them instead of giving each a full copy.
      RABBITMQ_SCHEDULE_QUEUE: ${RABBITMQ_LOGGER_SCHEDULE_QUEUE:-logger_schedule}
    depends_on:
      - db
      - rabbitmq
    restart: unless-stopped
  bench:
    build:
      context: .
      dockerfile: ./bench/Dockerfile
    environment:
      ENV: ${ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-rabbit}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_EXCHANGE_TYPE: ${RABBITMQ_EXCHANGE_TYPE:-topic}
      # Dedicated var — see the note on logger. Bench MUST get its own copy
      # of every schedule message; sharing a queue with logger would make it
      # miss roughly half of them and silently drop those pipeline runs.
      RABBITMQ_SCHEDULE_QUEUE: ${RABBITMQ_BENCH_SCHEDULE_QUEUE:-bench_schedule}
      RABBITMQ_SCHEDULE_EXCHANGE: ${RABBITMQ_SCHEDULE_EXCHANGE:-schedule_exchange}
      RABBITMQ_SCHEDULE_ROUTING_KEY: ${RABBITMQ_SCHEDULE_ROUTING_KEY:-schedule.*.pending}
      RABBITMQ_JOB_EXCHANGE: ${RABBITMQ_JOB_EXCHANGE:-job_exchange}
      RABBITMQ_JOB_STATUS_QUEUE: ${RABBITMQ_JOB_STATUS_QUEUE:-bench_job_status}
      RABBITMQ_JOB_STATUS_ROUTING_KEY: ${RABBITMQ_JOB_STATUS_ROUTING_KEY:-job.*.*.*}
      RABBITMQ_DATA_EXCHANGE: ${RABBITMQ_DATA_EXCHANGE:-data_exchange}
    depends_on:
      - db
      - rabbitmq
    restart: unless-stopped
  scraper:
    build:
      context: .
      dockerfile: ./scraper/Dockerfile
    environment:
      ENV: ${ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-rabbit}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_JOB_QUEUE: ${RABBITMQ_JOB_QUEUE:-scraper_jobs}
      RABBITMQ_JOB_EXCHANGE: ${RABBITMQ_JOB_EXCHANGE:-job_exchange}
      RABBITMQ_EXCHANGE_TYPE: ${RABBITMQ_EXCHANGE_TYPE:-topic}
      RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY:-job.*.*.pending}
      RABBITMQ_THROTTLE_QUEUE: ${RABBITMQ_THROTTLE_QUEUE:-throttle_requests}
      RCN_SCRATCH_DIR: ${RCN_SCRATCH_DIR:-/data/rcn_scratch}
      PHOTO_STORAGE_DIR: ${PHOTO_STORAGE_DIR:-/data/photos}
    volumes:
      # Ephemeral scratch space shared by all scraper replicas, so RCN's
      # DOWNLOAD -> EXTRACT -> READ stages can hand a binary file to each
      # other. Deliberately NOT durable: RCN files are cumulative, so losing
      # this volume just costs one re-download.
      - rcn_scratch:/data/rcn_scratch
      # Listing photos. Unlike the scratch volume this one IS the product —
      # losing it means re-downloading every photo of every listing. Becomes
      # an S3 bucket later (see src/sdk/storage.py).
      - photos:/data/photos
    depends_on:
      - db
      - rabbitmq
      - throttling
    restart: unless-stopped
  throttling:
    build:
      context: .
      dockerfile: ./throttling/Dockerfile
    environment:
      ENV: ${ENV}
      DATABASE: ${DATABASE:-postgres}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-rabbit}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_THROTTLE_QUEUE: ${RABBITMQ_THROTTLE_QUEUE:-throttle_requests}
      CONFIG_REFRESH_INTERVAL: ${CONFIG_REFRESH_INTERVAL:-60}
    depends_on:
      - db
      - redis
      - rabbitmq
    restart: unless-stopped
  data-ingestion:
    build:
      context: .
      dockerfile: ./data-ingestion/Dockerfile
    environment:
      ENV: ${ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-rabbit}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_DATA_QUEUE: ${RABBITMQ_DATA_QUEUE:-data-ingestion-jobs}
      RABBITMQ_DATA_EXCHANGE: ${RABBITMQ_DATA_EXCHANGE:-data_exchange}
      RABBITMQ_EXCHANGE_TYPE: ${RABBITMQ_EXCHANGE_TYPE:-topic}
      RABBITMQ_DATA_ROUTING_KEY: ${RABBITMQ_DATA_ROUTING_KEY:-data.*.*.pending}
      STARTUP_RETRIES: ${STARTUP_RETRIES:-5}
      STARTUP_RETRY_DELAY: ${STARTUP_RETRY_DELAY:-5}
    depends_on:
      - db
      - rabbitmq
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:3.12-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbit}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    hostname: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

volumes:
  postgres_data:
  staticfiles:
  redis_data:
  rabbitmq_data:
  rcn_scratch:
  photos:

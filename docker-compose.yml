version: "3.9"
services:
  crudhouse:
    build:
      context: ./crudhouse
    ports:
      - "8000:8000"
    volumes:
      - ./crudhouse/:/usr/src/app/crudhouse
      - staticfiles:/usr/src/app/crudhouse/static
    environment:
      ENV: ${ENV}
      DATABASE: ${DATABASE:-postgres}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      SUPERUSER_USERNAME: ${SUPERUSER_USERNAME}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
    depends_on:
      - db
  scheduler:
    build:
      context: ./scheduler
    environment:
      ENV: ${ENV}
      DATABASE: ${DATABASE:-postgres}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db
      - crudhouse
    restart: unless-stopped
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

volumes:
  postgres_data:
  staticfiles:
